# ============================================================================
# フェーズ1：毎日 12カ国のRSSを取得 → AIで日本語化 → 話題に束ねて公開する
#
# このファイルの置き場所は必ず  .github/workflows/daily.yml  です。
# （フォルダ名の先頭のドットを忘れると、GitHubはワークフローとして認識しません）
#
# 3段構えのパイプラインです。
#   ①収集   fetch.py    → data/days/D.json           （各国の見出しを集める）
#   ②AI付与 enrich.py   → data/days/D.enriched.json  （日本語訳・要約・タグ・論調）
#   ③クラスタ cluster.py → data/topics/D.json         （同じ話題を束ねて採点）
# ④表示は index.html が③の出力を読むだけなので、ここでは何もしません。
#
# 【重要】②はAPIキーが無くても止まりません（原語見出しのまま公開されます）。
# そのため「キーを登録する前でもサイトは動く」構成になっています。
# ただしキーが無い間は日本と海外の記事が同じ話題に束なりません
# （日本語と英語の見出しは文字が重ならないため）。この状態を degraded と呼び、
# 画面上部に「AI処理が適用されていません」と表示されます。
# 比較機能を働かせるには GEMINI_API_KEY の登録が必要です（手順書 STEP 7）。
# ============================================================================
name: daily-pipeline

on:
  # --------------------------------------------------------------------------
  # 【時刻について】cron の時刻は必ず UTC で書きます。JSTではありません。
  #   JST = UTC + 9時間  →  UTCに直すときは JSTから9時間引く
  #
  #   '10 22 * * *'  = 毎日 UTC 22:10  =  日本時間 翌朝 07:10  ← メインの実行
  #   '10 1  * * *'  = 毎日 UTC 01:10  =  日本時間 当日 10:10  ← 取りこぼし回収用
  #
  # メイン(07:10 JST)が混雑でスキップされても、10:10 JSTの2回目で拾い直せます。
  # スクリプトは冪等（同じ日に2回動かしても記事が二重にならない）なので、
  # 2回動くこと自体は問題ありません。
  #
  # 【重要・その1】GitHubの無料の cron は「遅延します」。
  #   数分〜十数分ズレるのが普通で、混雑時は数十分遅れたりスキップされたりします。
  #   「7:10ちょうどに更新されていない」のは故障ではありません。
  #   なお 00分ちょうどは一番混雑するので、あえて 10分 にずらしてあります。
  #
  # 【重要・その2】60日ルール
  #   「リポジトリに60日間なにも活動が無いと、schedule（自動実行）が
  #    GitHubによって自動的に止められる」という仕様があります。
  #   このワークフローは毎日データをコミットする＝毎日活動が発生するので、
  #   通常は自動的に回避されます。
  #   ただし「60日間ずっと取得に失敗し続けた」場合はコミットが発生しないため、
  #   止まる可能性があります。月に1回はサイトを目視してください。
  #   止まってしまったら、下の workflow_dispatch（手動実行）を1回押せば復活します。
  # --------------------------------------------------------------------------
  schedule:
    - cron: '10 22 * * *'   # UTC 22:10 = JST 翌朝 07:10
    - cron: '10 1 * * *'    # UTC 01:10 = JST 当日 10:10（取りこぼし回収）

  # 手動実行を有効にする。これがあると Actions タブに「Run workflow」ボタンが出ます。
  # 初回の動作確認と、cronが止まったときの復活はこのボタンで行います。
  workflow_dispatch:

# ----------------------------------------------------------------------------
# 生成したJSONをリポジトリに書き戻す（commit & push）ために必要な権限。
# これが無いと push の段階で「403 Permission denied」で失敗します。
# あわせて、リポジトリの Settings > Actions > General >
# 「Workflow permissions」も "Read and write permissions" にしてください
# （手順書の STEP 5。このファイルの設定と画面上の設定の両方が必要です）。
# ----------------------------------------------------------------------------
permissions:
  contents: write

# 同時に2つ動いて push がぶつからないようにする（手動実行とcronが重なったとき用）
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # 26本のフィード取得とAI付与で時間がかかるため上限を延ばしておく。
    # 通常は5〜10分で終わります。60分に達するのは異常なので打ち切ります。
    timeout-minutes: 60

    steps:
      # 1. リポジトリの中身をこの仮想マシンに持ってくる
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # 2. Python を用意する。
      #    3つのスクリプトはすべて標準ライブラリだけで書いてあるので
      #    pip install は不要です（＝依存の破損で止まることがない）。
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------------------------------------------------
      # 3. ①収集：12カ国のRSSから見出しを集める
      #
      #    continue-on-error: true にしているのは、一部のフィードが死んでいても
      #    残りを公開したいからです。1本も取れなかった日だけ exit 1 になります。
      #    そのとき data/months/YYYY-MM.json の該当日に status:"failed" が入ります。
      # ----------------------------------------------------------------------
      - name: ①収集（12カ国のRSSを取得）
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch.py

      # ----------------------------------------------------------------------
      # 4. ②AI付与：日本語訳・要約・タグ・論調をつける
      #
      #    【キーが無いときの挙動】
      #    GEMINI_API_KEY が未登録なら、enrich.py は原語見出しをそのまま通す
      #    「passthrough」モードで正常終了します（degraded な日として記録）。
      #    つまりキー未登録でもこのステップは赤くなりません。
      #
      #    キーの登録場所は Settings > Secrets and variables > Actions >
      #    「New repository secret」、名前は GEMINI_API_KEY（手順書 STEP 7）。
      #    ここに書くのは ${{ secrets.GEMINI_API_KEY }} という参照だけなので、
      #    キー本体がこのファイルやログに残ることはありません。
      #
      #    ★このステップにだけキーを渡しています（①③には渡していません）。
      #      漏えい面を最小にするためです。
      # ----------------------------------------------------------------------
      - name: ②AI付与（日本語訳・要約・タグ・論調）
        id: enrich
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/enrich.py

      # ----------------------------------------------------------------------
      # 5. ③クラスタ：同じ話題を束ねて採点する
      #
      #    スコア = 報道した国の数 × 3 ＋ 掲載媒体の数
      #    ②が degraded だった日もここは完走します（原語同士だけが寄ります）。
      # ----------------------------------------------------------------------
      - name: ③クラスタ（話題に束ねて採点）
        id: cluster
        continue-on-error: true
        run: python3 scripts/cluster.py

      # ----------------------------------------------------------------------
      # 6. 変更があればコミットして push する。
      #    変更が無いとき（＝新しい記事が1件も無かったとき）に
      #    `git commit` は失敗するので、差分の有無を先に確認しています。
      #
      #    ★ ①が失敗した日も「失敗した記録」をコミットします。
      #      欠損を隠さず、カレンダーに⚠として出すためです。
      # ----------------------------------------------------------------------
      - name: 生成データをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし（新しい記事がありませんでした）。コミットはしません。"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%MZ') の収集・AI付与・クラスタ結果を更新"
            # 別の実行が先に push していた場合に備えて、pull --rebase してから push する
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "push しました。"
          fi

      # ----------------------------------------------------------------------
      # 7. どこかが失敗していたら、このワークフローを「失敗（赤）」で終わらせる。
      #    こうしておくと GitHub から通知メールが届き、放置に気付けます。
      #    ★データのコミットより後に置いているのが重要です。
      #      先に赤で止めると、失敗の記録がサイトに反映されません。
      # ----------------------------------------------------------------------
      - name: どこかが失敗していたら赤で終了する
        if: |
          steps.fetch.outcome == 'failure' ||
          steps.enrich.outcome == 'failure' ||
          steps.cluster.outcome == 'failure'
        run: |
          echo "::error::パイプラインのどこかが失敗しました。①収集=${{ steps.fetch.outcome }} / ②AI付与=${{ steps.enrich.outcome }} / ③クラスタ=${{ steps.cluster.outcome }}"
          echo "①が failure の日は data/months/YYYY-MM.json の該当日に status:\"failed\" が記録され、サイトのカレンダーに⚠が出ます。"
          echo "②が failure になるのはAPIキーが「登録されているのに無効」なときです（未登録なら success のまま degraded になります）。"
          exit 1
