# Gemini 疎通診断（手動実行専用）
#
# Actions タブ → 左の「Gemini 疎通診断」→ 右の「Run workflow」→ 緑の「Run workflow」。
# 1分ほどで終わります。ログの「判定:」の行を見てください。
#   ✅ があれば、そのモデルは使えます（enrich.py が自動で使います）
#   「キーが無効」→ STEP 7 をやり直す／「混雑」→ キーは正常、時間をおく
# キーの値やエラー本文はログに出しません。消費は1モデル1リクエストだけです。
name: Gemini 疎通診断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 各モデルに1回ずつ問い合わせる
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python3 scripts/check_gemini.py
